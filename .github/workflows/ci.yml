name: PackSense checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ingestion dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q packsense tests
      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check frontend JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/demo.js
          node --check src/report.js
          node --check src/pipeline.js
          node --check tests/browser-smoke.mjs
          node --check tests/browser-reconnect-smoke.mjs
      - name: Run frontend contract tests
        run: npm test
      - name: Build deployable frontend
        run: npm run build
